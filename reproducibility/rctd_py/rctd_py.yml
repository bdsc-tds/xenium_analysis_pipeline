name: rctd_py
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy=1.26.4
  - pandas=2.2.3
  - scipy=1.14.1
  - anndata=0.11.3
  - h5py=3.12.1
  - pyarrow=18.1.0
  - natsort=8.4.0
  - click=8.1.8
  - pip
  - pip:
      # CUDA 12.4 build of torch: rctd-py's default pip resolution pulls a CUDA 13 build that needs NVIDIA driver >= 580
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.5.1+cu124
      - rctd-py==0.4.4
